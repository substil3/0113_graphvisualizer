<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="style.css">
<head>
  <meta charset="UTF-8" />
  <title>Point-Based Network Graph</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
  </style>
</head>
<body>
  <script type="module" src="./scripts/main.js"></script>

  <div id="console"></div>
  <button id="startSim" class="simButton">Start</button>
    <input
      id="senderId"
      class="simForm"
      placeholder="Sender ID"
      min="0"
    /> 
    <input
      id="receiverId"
      class="simForm"
      placeholder="Receiver ID"
      min="0"
    /> 
    <button id="packetType:REQ" class="simButton packetTypeButton"> REQ - 20 cost</button>
    <button id="packetType:CURE" class="simButton packetTypeButton"> CURE - 30 cost </button>
    <button id="packetType:REMOTE" class="simButton packetTypeButton"> REMOTE - 50 cost </button>
    <button id="packetType:BROADCAST" class="simButton packetTypeButton"> BROADCAST - 100 cost </button>
  <button id="sendPacket" class="simButton" type="submit">Send Packet</button>

<div id="metaPanel">
  <div class="metaRow">
    time: <span id="clockValueRow">0</span>
    sent: <span id="sentPacketNumberRow">0</span>
    received: <span id="receivedPacketNumberRow">0</span>
    aborted: <span id="abortedPacketNumberRow">0</span>
  </div>

  <div class="playerRow">
    Player: <span id="playerNameRow">DummyPlayer</span>
  </div>

  <div class="playerRow">
    Health:
    <div id="playerHealthBar" class="healthBar"></div>
  </div>

  <div class="playerRow">
    Cost: <span id="playerCostRow">0</span>
  </div>
</div>

<div id="sidePanel">
  <div class="routingHeader">Routing Table</div>
  <div id="routingList"></div>
  <button id="updateRoutingBtn" class="simButton routingUpdateBtn">
    Update
  </button>
</div>

</body>
</html>
